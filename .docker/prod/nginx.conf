limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /tmp/ops-agent-tls/tls.crt;
    ssl_certificate_key /tmp/ops-agent-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 2m;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /health { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location = /ready { proxy_pass http://backend:8000; proxy_set_header Host $host; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
