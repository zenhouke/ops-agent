name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyright
          pnpm --dir web install --frozen-lockfile

      - name: Validate source
        run: |
          python -m compileall -q src/app
          pyright
          pnpm --dir web lint
          pnpm --dir web build

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_paths: |
              web/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact_paths: |
              web/src-tauri/target/release/bundle/deb/*.deb
              web/src-tauri/target/release/bundle/rpm/*.rpm
              web/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            platform: windows
            artifact_paths: |
              web/src-tauri/target/release/bundle/msi/*.msi
              web/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyright

      - name: Install frontend deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Set bundle version
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          release_version="$RELEASE_INPUT"
          release_version="${release_version#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_INPUT" >&2
            exit 1
          fi
          RELEASE_VERSION="$release_version" python - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path("web/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["version"] = os.environ["RELEASE_VERSION"]
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build backend binary
        run: python scripts/build_backend_binary.py --platform ${{ matrix.platform }}

      - name: Validate desktop
        run: cargo check --manifest-path web/src-tauri/Cargo.toml

      - name: Build desktop bundle (Linux)
        if: matrix.platform == 'linux'
        working-directory: web
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: pnpm tauri:build

      - name: Build desktop bundle (macOS)
        if: matrix.platform == 'macos'
        working-directory: web
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: pnpm tauri:build

      - name: Build desktop bundle (Windows)
        if: matrix.platform == 'windows'
        working-directory: web
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm tauri:build

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops-agent-${{ matrix.platform }}
          if-no-files-found: error
          path: ${{ matrix.artifact_paths }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          release_version="$RELEASE_INPUT"
          release_tag="v${release_version#v}"
          if release_is_draft="$(gh release view "$release_tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $release_tag already exists and is not a draft" >&2
              exit 1
            fi
          else
            gh release create "$release_tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Ops Agent $release_tag" \
              --generate-notes
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' release_assets < <(find artifacts -type f -print0)
          if (( ${#release_assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
