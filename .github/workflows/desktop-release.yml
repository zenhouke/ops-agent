name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-policy:
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - name: Checkout protected release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require current main HEAD
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

      - name: Require release signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          required=(
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBKEY
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY
            APPLE_API_KEY_CONTENT KEYCHAIN_PASSWORD WINDOWS_CERTIFICATE
            WINDOWS_CERTIFICATE_PASSWORD WINDOWS_TIMESTAMP_URL
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release credential: $name" >&2
              exit 1
            fi
          done

  validate:
    needs: release-policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyright==1.1.411 pip-audit==2.10.1
          pnpm --dir web install --frozen-lockfile
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Validate source
        run: |
          python -m compileall -q src/app
          python scripts/eval_agent_dialogue.py
          python scripts/eval_runtime_events.py
          pyright
          pnpm --dir web lint
          pnpm --dir web build
          install -Dm755 /dev/null web/bin/ops-agent-backend
          cargo check --manifest-path web/src-tauri/Cargo.toml
          pip-audit -r requirements.lock
          pnpm --dir web audit --prod
          cargo audit --file web/src-tauri/Cargo.lock

  build:
    needs: validate
    environment: production-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_paths: |
              web/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact_paths: |
              web/src-tauri/target/release/bundle/deb/*.deb
              web/src-tauri/target/release/bundle/rpm/*.rpm
              web/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            platform: windows
            artifact_paths: |
              web/src-tauri/target/release/bundle/msi/*.msi
              web/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller==6.22.0 pyright==1.1.411

      - name: Install frontend deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Set bundle version
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          release_version="$RELEASE_INPUT"
          release_version="${release_version#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_INPUT" >&2
            exit 1
          fi
          RELEASE_VERSION="$release_version" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          config_path = Path("web/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["version"] = version
          updater_public_key = os.environ.get("TAURI_UPDATER_PUBKEY", "").strip()
          if not updater_public_key:
              raise SystemExit("TAURI_UPDATER_PUBKEY is required")
          config["plugins"]["updater"]["pubkey"] = updater_public_key
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          web_package_path = Path("web/package.json")
          web_package = json.loads(web_package_path.read_text(encoding="utf-8"))
          web_package["version"] = version
          web_package_path.write_text(json.dumps(web_package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          cargo_path = Path("web/src-tauri/Cargo.toml")
          cargo_text = cargo_path.read_text(encoding="utf-8")
          cargo_text = re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', cargo_text, count=1)
          cargo_path.write_text(cargo_text, encoding="utf-8")

          Path("src/app/build_metadata.py").write_text(
              f'VERSION = "{version}"\nBUILD_SHA = "{os.environ["GITHUB_SHA"]}"\n',
              encoding="utf-8",
          )
          PY

      - name: Build backend binary
        run: python scripts/build_backend_binary.py --platform ${{ matrix.platform }}

      - name: Smoke packaged backend
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            python scripts/smoke_backend_binary.py web/bin/ops-agent-backend.exe
          else
            python scripts/smoke_backend_binary.py web/bin/ops-agent-backend
          fi

      - name: Validate desktop
        run: cargo check --manifest-path web/src-tauri/Cargo.toml

      - name: Build desktop bundle (Linux)
        if: matrix.platform == 'linux'
        working-directory: web
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: pnpm tauri:build

      - name: Import Apple signing identity
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/ops-agent-certificate.p12"
          keychain_path="$RUNNER_TEMP/ops-agent-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare Apple notarization key
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build desktop bundle (macOS)
        if: matrix.platform == 'macos'
        working-directory: web
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: pnpm tauri:build

      - name: Verify macOS signing and notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app_path="$(find web/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find web/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_path" && test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'ops-agent-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows signing certificate import failed' }
          $configPath = 'web/src-tauri/tauri.windows.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{
            certificateThumbprint = $certificate.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = $env:WINDOWS_TIMESTAMP_URL
          }) -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath

      - name: Build desktop bundle (Windows)
        if: matrix.platform == 'windows'
        working-directory: web
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: pnpm tauri:build

      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem web/src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $artifacts) { throw 'No Windows installer artifacts found' }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($artifact.FullName) ($($signature.Status))" }
          }

      - name: Smoke installed Linux package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          package="$(find web/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$package"
          sudo dpkg -i "$package"
          package_name="$(dpkg-deb -f "$package" Package)"
          executable="$(dpkg -L "$package_name" | awk '/\/usr\/bin\//{print; exit}')"
          test -x "$executable"
          xvfb-run -a "$executable" &
          app_pid=$!
          sleep 10
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true

      - name: Smoke installed macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          dmg_path="$(find web/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          mount_point="$RUNNER_TEMP/ops-agent-dmg"
          install_path="$RUNNER_TEMP/Ops Agent.app"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg_path" -mountpoint "$mount_point" -nobrowse
          source_app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          ditto "$source_app" "$install_path"
          hdiutil detach "$mount_point"
          open "$install_path"
          sleep 10
          pgrep -f "$install_path/Contents/MacOS" >/dev/null
          pkill -f "$install_path/Contents/MacOS" || true

      - name: Smoke installed Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem web/src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer not found' }
          $installer = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "MSI install failed with $($installer.ExitCode)" }
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA) | Where-Object { $_ }
          $executable = $null
          foreach ($root in $roots) {
            $executable = Get-ChildItem $root -Recurse -Filter ops-agent-desktop.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($executable) { break }
          }
          if (-not $executable) { throw 'Installed desktop executable not found' }
          $process = Start-Process $executable.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "Installed application exited with $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Prepare updater artifact
        run: python scripts/prepare_release_output.py --platform ${{ matrix.platform }} --bundle-root web/src-tauri/target/release/bundle --output release-output

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ops-agent-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            ${{ matrix.artifact_paths }}
            release-output/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: artifacts
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
          upload-artifact: false

      - name: Build signed updater manifest
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          release_version="${RELEASE_INPUT#v}"
          release_tag="v$release_version"
          python scripts/build_updater_manifest.py artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$release_tag" \
            --version "$release_version" \
            --output artifacts/latest.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: artifacts/**/*

      - name: Prepare draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          release_version="$RELEASE_INPUT"
          release_tag="v${release_version#v}"
          if release_is_draft="$(gh release view "$release_tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $release_tag already exists and is not a draft" >&2
              exit 1
            fi
          else
            gh release create "$release_tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Ops Agent $release_tag" \
              --generate-notes
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' release_assets < <(find artifacts -type f ! -name updater-metadata.json -print0)
          if (( ${#release_assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
