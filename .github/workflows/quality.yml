name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyright==1.1.411 pip-audit==2.10.1
          pnpm --dir web install --frozen-lockfile
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Validate
        run: |
          python -m compileall -q src/app
          python scripts/eval_agent_dialogue.py
          python scripts/eval_runtime_events.py
          pyright
          pnpm --dir web lint
          pnpm --dir web build
          install -Dm755 /dev/null web/bin/ops-agent-backend
          cargo check --manifest-path web/src-tauri/Cargo.toml

      - name: Audit production dependencies
        run: |
          pip-audit -r requirements.lock
          pnpm --dir web audit --prod
          cargo audit --file web/src-tauri/Cargo.lock
